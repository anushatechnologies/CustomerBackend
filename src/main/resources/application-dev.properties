# ============================================================================
# DEV PROFILE — Local Development Only (H2 in-memory database)
# ============================================================================
# Activate with: -Dspring.profiles.active=dev
# This profile overrides ALL production database and Firebase settings.
# Local dev NEVER connects to AWS RDS. If you accidentally start without this
# profile and without env vars set, startup will fail fast (by design).
# ============================================================================

# H2 In-Memory Database (replaces MySQL — no local DB installation required)
spring.datasource.url=jdbc:h2:mem:customer_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

server.port=9000

# Firebase: no credentials required in dev. Token verification is DISABLED.
# FirebaseConfig detects the 'dev' profile and returns null safely.
# The FirebaseAuthenticationFilter skips verification when FirebaseAuth is null.
firebase.project-id=

# Admin email allow-list for local development
app.security.admin-emails=admin@hinchmart.com
