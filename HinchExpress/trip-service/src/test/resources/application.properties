server.port=0
spring.application.name=trip-service-test

# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:trip_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in unit tests
spring.flyway.enabled=false

# Disable Outbox Relay polling during unit tests
hinchexpress.outbox.relay-interval-ms=999999999
hinchexpress.kafka.topics.delivery-events=delivery.events.test

