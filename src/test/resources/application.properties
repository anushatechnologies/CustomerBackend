spring.application.name=customer-project-test
server.port=0

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:customer_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# AWS S3 Mock properties
aws.region=ap-south-2
aws.s3.bucket-name=hinchmart-storage-test
