spring.application.name=customer-project
server.port=${SERVER_PORT:9000}

# Database Configuration
# IMPORTANT: DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD MUST be supplied via environment
# variables injected from GitHub Actions Secrets. There are intentionally NO hardcoded
# production defaults here — a missing variable will cause a clear startup failure.
# For local development, use the 'dev' Spring profile (application-dev.properties).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing live database baseline
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Actuator Configuration - Expose only health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# AWS S3 Image Storage Configuration
aws.region=${AWS_REGION:ap-south-2}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:hinchmart-storage-191481838776-ap-south-2-an}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Firebase Admin SDK Configuration
# Firebase Admin SDK Configuration
# Credentials are injected from GitHub Secrets. No hardcoded defaults in production.
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.config-path=${FIREBASE_CONFIG_PATH:}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Location & Geocoding Provider Configuration
location.provider=${LOCATION_PROVIDER:google}
location.api-key=${MAPS_API_KEY:}
location.base-url=${MAPS_BASE_URL:}
location.timeout-ms=${MAPS_TIMEOUT_MS:5000}

# Razorpay Payment Gateway Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# Resend Email Service Configuration
resend.api.url=${RESEND_API_URL:https://api.resend.com/emails}
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:noreply@hinchmart.com}
resend.from.name=${RESEND_FROM_NAME:HinchMart}
resend.reply-to.email=${RESEND_REPLY_TO:hinchmart@gmail.com}

# Security & Admin Configuration
# Security: Admin email allow-list. Injected from ADMIN_EMAILS GitHub Secret in production.
# For local dev, set ADMIN_EMAILS in your environment or rely on the dev profile default.
app.security.admin-emails=${ADMIN_EMAILS:admin@hinchmart.com}

# Kafka & HichExpress Integration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-confirmed=${KAFKA_TOPIC_ORDER_CONFIRMED:order.confirmed}
app.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
app.outbox.relay.fixed-delay-ms=${OUTBOX_RELAY_FIXED_DELAY_MS:3000}

# Spring AI Ollama Configuration (Local AI - No OpenAI / No token billing)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2-vision}
spring.ai.ollama.chat.options.temperature=0.1

# HinchMart AI Estimation Configuration
hinchmart.estimation.quote-validity-days=${QUOTE_VALIDITY_DAYS:15}


